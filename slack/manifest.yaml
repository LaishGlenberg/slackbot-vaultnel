# Slack app manifest for Vaultnel.
# Create: https://api.slack.com/apps → Create New App → From an app manifest
# Paste this file (YAML tab), pick your workspace, then install to workspace.
#
# Socket Mode means no request URLs are needed anywhere in this manifest.
display_information:
  name: Vaultnel
  description: AI assistant that answers in DMs and threads.
  background_color: "#1f2937"

features:
  app_home:
    home_tab_enabled: false
    # Without the messages tab, Slack refuses DMs with "Sending messages to this
    # app has been turned off" and the app never appears under Apps.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: vaultnel
    always_online: true
  slash_commands:
    - command: /ask
      description: Ask Vaultnel a question
      usage_hint: "[question]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read   # see @mentions
      - chat:write          # post / update messages
      - commands            # /ask
      - im:history          # read DM messages
      - im:read
      - im:write            # open DM, get DM channel id
      - reactions:write     # :eyes: ack reaction
      - reactions:read      # 🗑️ reaction resets a thread
      - users:read          # resolve user ids to names

settings:
  event_subscriptions:
    bot_events:
      # Agent view: lets the app notice a user opening the DM tab.
      - app_home_opened
      - app_mention
      - message.im
      - reaction_added
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
