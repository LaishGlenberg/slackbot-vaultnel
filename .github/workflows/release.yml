name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute the next tag
        id: next
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)"
          if [ -z "$previous" ]; then
            echo "No v*.*.* tag found" >&2
            exit 1
          fi

          version="${previous#v}"
          IFS=. read -r major minor patch <<< "$version"
          tag="v${major}.${minor}.$((patch + 1))"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
            && { echo "Tag $tag already exists" >&2; exit 1; }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes-start-tag "$PREVIOUS"
